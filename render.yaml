# ────────────────────────────────────────────────────────────────
#  Blueprint Render — Elysia Bot
#  Déploiement en un clic : New + → Blueprint → sélectionnez ce dépôt.
#  Documentation complète : docs/DEPLOIEMENT-RENDER-UPTIMEROBOT.md
# ────────────────────────────────────────────────────────────────
services:
  - type: web
    name: elysia-bot
    runtime: node
    plan: free
    region: frankfurt # oregon | ohio | virginia | singapore
    branch: main
    buildCommand: npm ci --include=dev && npm run build # --include=dev : NODE_ENV=production ferait sinon sauter typescript/tsx
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 22.11.0
      - key: NODE_ENV
        value: production
      # Ces secrets doivent être renseignés dans le tableau de bord Render
      # (Environment → Add Environment Variable) : jamais dans le dépôt !
      - key: DISCORD_TOKEN
        sync: false
      - key: CLIENT_ID
        sync: false
      - key: DEV_GUILD_ID
        sync: false
      - key: OWNER_IDS
        sync: false
      - key: SELF_PING_URL
        sync: false
      # Code d'accès de l'onglet admin caché (/admin) : à changer impérativement.
      - key: ADMIN_PANEL_CODE
        sync: false
      # Serveur(s) de TEST autorisés pour le simulateur de raid.
      # À LAISSER VIDE en production : le simulateur est alors désactivé.
      - key: RAID_SIM_GUILD_IDS
        sync: false
      # Liste blanche d'IP pour l'onglet admin (vide = toutes les IP).
      - key: ADMIN_ALLOWED_IPS
        sync: false
      # Durée de session (minutes) et verrouillage anti-brute-force (secondes).
      - key: ADMIN_SESSION_TTL_MINUTES
        value: "60"
      - key: ADMIN_LOCKOUT_SECONDS
        value: "900"
      # Réglages non sensibles
      - key: HOST
        value: 0.0.0.0
      - key: LOG_LEVEL
        value: info
      - key: LOG_FORMAT
        value: json # logs lisibles dans l'onglet Logs de Render
      - key: DEFAULT_LOCALE
        value: fr
      - key: SELF_PING_INTERVAL
        value: "14"
